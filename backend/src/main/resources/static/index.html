<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0C10',
                        card: '#1F2833',
                        cyan: '#66FCF1',
                        cyanLight: '#45A29E',
                        gold: '#F2A900',
                        glow: 'rgba(102, 252, 241, 0.4)'
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(102, 252, 241, 0.2)',
                        'glow-hover': '0 0 25px rgba(102, 252, 241, 0.5)'
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- React Router -->
    <script crossorigin src="https://unpkg.com/@remix-run/router@1.4.0/dist/router.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router@6.9.0/dist/umd/react-router.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6.9.0/dist/umd/react-router-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #0B0C10; color: #C5C6C7; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden;}
        .text-cyan-gradient {
            background: linear-gradient(90deg, #66FCF1 0%, #45A29E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { HashRouter, Routes, Route, Link, useLocation } = ReactRouterDOM;

        // Custom Icon Component to easily render Lucide icons
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            });
            return <i data-lucide={name} className={className}></i>;
        };

        const Sidebar = () => {
            const location = useLocation();
            
            const navLinks = [
                { path: '/', label: 'Dashboard', icon: 'layout-dashboard' },
                { path: '/check-in', label: 'Check-In / Check-Out', icon: 'log-in' },
                { path: '/room-service', label: 'Room Service', icon: 'concierge-bell' },
                { path: '/payments', label: 'Payment Details', icon: 'credit-card' },
                { path: '/guests', label: 'Guest Personal Information', icon: 'users' },
                { path: '/availability', label: 'Room Availability', icon: 'calendar-check' }
            ];

            return (
                <aside className="w-72 bg-card h-screen border-r border-gray-800 fixed left-0 top-0 shadow-glow flex flex-col z-10">
                    <div className="p-8 border-b border-gray-800">
                        <div className="flex items-center gap-4">
                            <Icon name="hotel" className="text-cyan w-10 h-10" />
                            <h1 className="text-2xl font-bold text-cyan-gradient">
                                Hotel Mgmt
                            </h1>
                        </div>
                    </div>
                    <nav className="flex-1 p-6 space-y-3 overflow-y-auto">
                        {navLinks.map((link, idx) => {
                            const isActive = location.pathname === link.path;
                            return (
                                <Link key={idx} to={link.path} 
                                    className={`flex items-center gap-4 px-4 py-3 rounded-lg transition-all duration-300 ${isActive ? 'bg-cyan/10 text-cyan shadow-[inset_4px_0_0_0_#66FCF1]' : 'text-gray-400 hover:bg-white/5 hover:text-white'}`}>
                                    <Icon name={link.icon} className="w-5 h-5" />
                                    <span className="font-medium tracking-wide">{link.label}</span>
                                </Link>
                            );
                        })}
                    </nav>
                </aside>
            );
        };

        const Dashboard = () => {
            return (
                <div className="animate-in fade-in duration-500">
                    <header className="flex justify-between items-center mb-10 border-b border-gray-800 pb-6">
                        <h2 className="text-3xl font-bold text-white">Dashboard Overview</h2>
                        <div className="flex items-center gap-4">
                            <span className="text-gray-400">Admin Staff</span>
                            <div className="w-12 h-12 rounded-full border-2 border-cyan p-0.5 shadow-glow">
                                <div className="w-full h-full rounded-full bg-card flex items-center justify-center">
                                    <Icon name="user" className="w-6 h-6 text-cyan" />
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-10">
                        {/* Stat Cards */}
                        <div className="bg-card p-6 rounded-2xl border border-gray-800 hover:border-cyan transition-all duration-300 shadow-glow hover:shadow-glow-hover cursor-pointer">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-gray-400 text-sm font-medium">Total Rooms</p>
                                    <h3 className="text-4xl font-bold mt-2 text-white">124</h3>
                                </div>
                                <div className="bg-cyan/10 p-3 rounded-xl text-cyan">
                                    <Icon name="key" />
                                </div>
                            </div>
                        </div>
                        <div className="bg-card p-6 rounded-2xl border border-gray-800 hover:border-cyan transition-all duration-300 shadow-glow hover:shadow-glow-hover cursor-pointer">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-gray-400 text-sm font-medium">Booked</p>
                                    <h3 className="text-4xl font-bold mt-2 text-cyan">86</h3>
                                </div>
                                <div className="bg-cyan/10 p-3 rounded-xl text-cyan">
                                    <Icon name="calendar-check" />
                                </div>
                            </div>
                        </div>
                        <div className="bg-card p-6 rounded-2xl border border-gray-800 hover:border-gold transition-all duration-300 shadow-glow hover:shadow-glow-hover cursor-pointer">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-gray-400 text-sm font-medium">Available</p>
                                    <h3 className="text-4xl font-bold mt-2 text-gold">38</h3>
                                </div>
                                <div className="bg-gold/10 p-3 rounded-xl text-gold">
                                    <Icon name="door-open" />
                                </div>
                            </div>
                        </div>
                        <div className="bg-card p-6 rounded-2xl border border-gray-800 hover:border-cyan transition-all duration-300 shadow-glow hover:shadow-glow-hover cursor-pointer">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-gray-400 text-sm font-medium">Revenue</p>
                                    <h3 className="text-4xl font-bold mt-2 text-white">$12,450</h3>
                                </div>
                                <div className="bg-cyan/10 p-3 rounded-xl text-cyan">
                                    <Icon name="dollar-sign" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const GuestInformation = () => {
            const [formData, setFormData] = useState({ fullName: '', email: '', phone: '', address: '' });
            const [guests, setGuests] = useState([]);
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState('');

            const fetchGuests = async () => {
                try {
                    const res = await fetch('http://localhost:8080/api/guests');
                    if (res.ok) {
                        const data = await res.json();
                        setGuests(data);
                    }
                } catch (err) {
                    console.error("Could not fetch guests. Ensure backend is running.", err);
                }
            };

            useEffect(() => {
                fetchGuests();
            }, []);

            const handleChange = (e) => setFormData({...formData, [e.target.name]: e.target.value});

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await fetch('http://localhost:8080/api/guests', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    if (res.ok) {
                        setMsg("Guest saved successfully!");
                        setFormData({ fullName: '', email: '', phone: '', address: '' });
                        fetchGuests();
                    } else {
                        setMsg("Error saving guest.");
                    }
                } catch (err) {
                    setMsg("Network error. Backend might not be running.");
                }
                setLoading(false);
                setTimeout(() => setMsg(''), 3000);
            };

            return (
                <div className="animate-in fade-in duration-500">
                    <header className="mb-10 border-b border-gray-800 pb-6">
                        <h2 className="text-3xl font-bold text-white">Guest Personal Information</h2>
                    </header>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        {/* Form */}
                        <div className="bg-card p-8 rounded-2xl border border-gray-800 shadow-glow">
                            <h3 className="text-xl font-semibold mb-6 flex items-center gap-2 text-cyan">
                                <Icon name="user-plus" className="w-5 h-5"/> Register New Guest
                            </h3>
                            {msg && <div className="mb-4 p-3 bg-cyan/20 border border-cyan text-cyan rounded-lg">{msg}</div>}
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div>
                                    <label className="block text-gray-400 text-sm mb-2">Full Name</label>
                                    <input type="text" name="fullName" value={formData.fullName} onChange={handleChange} required
                                        className="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all" placeholder="John Doe"/>
                                </div>
                                <div>
                                    <label className="block text-gray-400 text-sm mb-2">Email Address</label>
                                    <input type="email" name="email" value={formData.email} onChange={handleChange} required
                                        className="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all" placeholder="john@example.com"/>
                                </div>
                                <div>
                                    <label className="block text-gray-400 text-sm mb-2">Phone Number</label>
                                    <input type="text" name="phone" value={formData.phone} onChange={handleChange} required
                                        className="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all" placeholder="+1 234 567 8900"/>
                                </div>
                                <div>
                                    <label className="block text-gray-400 text-sm mb-2">Home Address</label>
                                    <textarea name="address" value={formData.address} onChange={handleChange} required rows="3"
                                        className="w-full bg-dark border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all" placeholder="123 Main St, City, Country"></textarea>
                                </div>
                                <button type="submit" disabled={loading}
                                    className="w-full bg-cyan hover:bg-cyanLight text-dark font-bold py-3 px-4 rounded-lg transition-all shadow-[0_0_15px_rgba(102,252,241,0.5)]">
                                    {loading ? 'Saving...' : 'Save Guest Details'}
                                </button>
                            </form>
                        </div>

                        {/* Recent Guests List */}
                        <div className="bg-card p-8 rounded-2xl border border-gray-800 shadow-glow">
                            <h3 className="text-xl font-semibold mb-6 flex items-center gap-2 text-white">
                                <Icon name="list" className="w-5 h-5"/> Registered Guests
                            </h3>
                            <div className="space-y-4">
                                {guests.length === 0 ? (
                                    <p className="text-gray-500 italic">No guests found. Backend API might not be connected.</p>
                                ) : (
                                    guests.map((g, i) => (
                                        <div key={i} className="p-4 bg-dark rounded-xl border border-gray-800 flex justify-between items-center hover:border-cyan transition-all">
                                            <div>
                                                <h4 className="font-semibold text-white">{g.fullName}</h4>
                                                <p className="text-sm text-gray-400">{g.email}</p>
                                            </div>
                                            <div className="bg-cyan/10 p-2 rounded-lg">
                                                <Icon name="check-circle" className="w-5 h-5 text-cyan" />
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const PlaceholderView = ({ title, icon }) => (
            <div className="animate-in fade-in duration-500 h-full flex flex-col items-center justify-center py-20 text-center">
                <div className="w-24 h-24 bg-card rounded-full flex items-center justify-center mb-6 shadow-glow border border-cyan/30">
                    <Icon name={icon} className="w-12 h-12 text-cyan" />
                </div>
                <h2 className="text-3xl font-bold text-white mb-4">{title}</h2>
                <p className="text-gray-400 max-w-md mx-auto">This module is currently under development. Please check back later or proceed to Guest Information.</p>
            </div>
        );

        const App = () => {
            return (
                <HashRouter>
                    <div className="flex bg-dark min-h-screen font-sans">
                        <Sidebar />
                        <main className="flex-1 ml-72 p-10 min-h-screen">
                            <Routes>
                                <Route path="/" element={<Dashboard />} />
                                <Route path="/guests" element={<GuestInformation />} />
                                <Route path="/check-in" element={<PlaceholderView title="Check-In / Check-Out" icon="log-in" />} />
                                <Route path="/room-service" element={<PlaceholderView title="Room Service" icon="concierge-bell" />} />
                                <Route path="/payments" element={<PlaceholderView title="Payment Details" icon="credit-card" />} />
                                <Route path="/availability" element={<PlaceholderView title="Room Availability" icon="calendar-check" />} />
                            </Routes>
                        </main>
                    </div>
                </HashRouter>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
